<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FaithMate — Catechism Learning, Grade 1-12</title>
<style>
:root{
  --bg:#0b1220; --bg2:#101a2e; --surface:#131f38; --surface2:#182642;
  --border:#22314f; --text:#eaf0fb; --muted:#94a6c7;
  --violet:#6d6ff2; --violet2:#8f92ff; --teal:#37c2b3; --gold:#f2c265; --dawn:#f4906b;
  --green:#34d399; --red:#f87171;
  --radius:16px; --radius-lg:22px;
  --shadow: 0 10px 40px rgba(30,50,110,.35);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% -10%, rgba(109,111,242,.22), transparent 45%),
    radial-gradient(circle at 100% 0%, rgba(242,194,101,.10), transparent 40%),
    var(--bg);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
h1{font-size:clamp(26px,4vw,42px)}
h2{font-size:clamp(20px,3vw,28px)}
h3{font-size:18px;margin-bottom:6px}
p{line-height:1.6;color:var(--text)}
.fm-muted{color:var(--muted);font-size:14px}
.fm-gradient{background:linear-gradient(90deg,var(--violet2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

.fm-reveal{animation:fmFade .5s ease both}
.fm-reveal-onscroll{opacity:0;transform:translateY(24px);transition:opacity .7s ease, transform .7s ease}
.fm-reveal-onscroll.is-in{opacity:1;transform:none}
@keyframes fmFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.fm-nav{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:14px 28px;background:rgba(11,18,32,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.fm-nav__brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;cursor:pointer;white-space:nowrap}
.fm-nav__brand b{color:var(--violet2)}
.fm-nav__links{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.fm-nav__links::-webkit-scrollbar{display:none}
.fm-nav__link{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:14px;color:var(--muted);white-space:nowrap;transition:.15s}
.fm-nav__link:hover{color:var(--text);background:var(--surface2)}
.fm-nav__link.is-active{color:#0b1220;background:linear-gradient(135deg,var(--teal),var(--gold));font-weight:700}
.fm-nav__right{display:flex;align-items:center;gap:10px}
.fm-chip{padding:6px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:13px;cursor:pointer}
.fm-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--violet),var(--teal));font-weight:700;cursor:pointer}
.fm-nav__burger{display:none;background:none;border:none;color:var(--text);font-size:22px}
.fm-mobilenav{display:none;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--border);padding:6px 10px}
.fm-mobilenav.is-open{display:flex}
.fm-mobilenav__link{padding:12px 10px;border-radius:10px;color:var(--muted)}
.fm-mobilenav__link.is-active{color:#fff;background:var(--surface2)}
@media (max-width:920px){.fm-nav__links{display:none}.fm-nav__burger{display:block}}

.fm-main{max-width:920px;margin:0 auto;padding:40px 24px 80px;position:relative}
.fm-main--wide{max-width:1160px}
.fm-footer{text-align:center;color:var(--muted);font-size:13px;padding:26px;border-top:1px solid var(--border)}
.fm-section{margin-top:46px}
.fm-pagehead{margin-bottom:28px}
.fm-pagehead--row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
.fm-pagehead__badges{display:flex;gap:8px}

.fm-tag{display:inline-block;padding:5px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--violet2);font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:10px}
.fm-tag--demo{background:rgba(242,194,101,.12);border-color:rgba(242,194,101,.4);color:var(--gold)}
.fm-badge{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap}
.fm-badge--xp{background:rgba(109,111,242,.18);color:var(--violet2);border:1px solid rgba(109,111,242,.4)}
.fm-badge--streak{background:rgba(242,194,101,.14);color:var(--gold);border:1px solid rgba(242,194,101,.35)}

.fm-btn{border:none;border-radius:12px;padding:12px 20px;font-weight:700;font-size:14px;transition:.15s transform,.15s box-shadow,.15s background}
.fm-btn--primary{background:linear-gradient(135deg,var(--violet),var(--teal));color:#fff;box-shadow:var(--shadow)}
.fm-btn--primary:hover{transform:translateY(-2px)}
.fm-btn--outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.fm-btn--outline:hover{border-color:var(--violet2);color:var(--violet2)}
.fm-btn--ghost{background:var(--surface2);color:var(--text)}
.fm-btn--ghost:hover{background:var(--surface)}

.fm-card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;transition:.2s transform,.2s border-color}
.fm-card:hover{transform:translateY(-3px);border-color:rgba(109,111,242,.5)}
.fm-card--accent{border-color:rgba(109,111,242,.55);box-shadow:var(--shadow)}
.fm-card--notice{border-color:rgba(242,194,101,.4);background:linear-gradient(180deg,rgba(242,194,101,.08),var(--bg2))}
.fm-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
@media (max-width:800px){.fm-grid3{grid-template-columns:1fr}}

.fm-progress{display:flex;flex-direction:column;gap:6px}
.fm-progress__track{height:10px;border-radius:20px;background:var(--surface2);overflow:hidden}
.fm-progress__fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--violet),var(--teal));transition:width .8s ease}
.fm-progress__label{font-size:12px;color:var(--muted)}

.fm-hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:30px 0 10px;overflow:hidden;border-radius:28px}
@media (max-width:900px){.fm-hero{grid-template-columns:1fr}}
.fm-hero__text{position:relative;z-index:2}
.fm-hero__cta{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}
.fm-hero__stats{display:flex;gap:30px;margin-top:10px}
.fm-hero__stats div{display:flex;flex-direction:column}
.fm-hero__stats b{font-size:22px}
.fm-hero__stats span{color:var(--muted);font-size:12px}
.fm-hero__art{position:relative;min-height:340px;display:flex;align-items:flex-end;justify-content:center}
.fm-skyline{position:absolute;inset:0;width:100%;height:100%}
.fm-hero__card{position:relative;z-index:2;background:rgba(19,31,56,.88);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;width:260px;box-shadow:var(--shadow);margin:0 0 18px}
.fm-hero__card-row{padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.fm-hero__card-row:last-of-type{border-bottom:none}

.fm-flowgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media (max-width:800px){.fm-flowgrid{grid-template-columns:repeat(2,1fr)}}
.fm-flowstep{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:8px}
.fm-flowstep__n{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--teal));display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}

.fm-cta-banner{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,rgba(109,111,242,.16),rgba(242,194,101,.10));border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;gap:20px;flex-wrap:wrap}

.fm-audience{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
@media (max-width:800px){.fm-audience{grid-template-columns:1fr}}
.fm-audience__card{border-radius:var(--radius-lg);padding:26px;border:1px solid var(--border)}
.fm-audience__card--students{background:linear-gradient(160deg,rgba(109,111,242,.16),var(--bg2))}
.fm-audience__card--teachers{background:linear-gradient(160deg,rgba(55,194,179,.14),var(--bg2))}
.fm-audience__card ul{margin:12px 0 18px;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.8}

.fm-authcard{max-width:420px;margin:20px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px}
.fm-field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:16px}
.fm-field input,.fm-field select,.fm-field textarea{padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px;font-family:inherit;resize:vertical}
.fm-field input:focus,.fm-field select:focus,.fm-field textarea:focus{outline:2px solid var(--violet2)}

.fm-founder{display:flex;gap:20px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin:18px 0}
.fm-founder__avatar{width:64px;height:64px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}

.fm-gradegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:800px){.fm-gradegrid{grid-template-columns:repeat(2,1fr)}}
.fm-gradecard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;color:var(--text);text-align:left;transition:.15s}
.fm-gradecard:hover{border-color:var(--violet2);transform:translateY(-2px)}
.fm-gradecard.is-selected{border-color:var(--violet);background:linear-gradient(180deg,rgba(109,111,242,.16),transparent)}
.fm-gradecard__num{font-size:26px;font-weight:800;color:var(--violet2)}
.fm-gradecard__label{font-weight:700}
.fm-gradecard__unit{font-size:12px;color:var(--muted)}

.fm-lessonlist{display:flex;flex-direction:column;gap:12px}
.fm-lessonrow{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
.fm-lessonrow.is-done{border-color:rgba(52,211,153,.4)}
.fm-lessonrow__num{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.fm-lessonrow.is-done .fm-lessonrow__num{background:rgba(52,211,153,.2);color:var(--green)}
.fm-lessonrow__body{flex:1}
.fm-lessonrow__body h3{margin-bottom:2px}
.fm-lessoncontent{display:flex;flex-direction:column;gap:14px}
.fm-lessonactions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}

.fm-quizwrap{max-width:640px;margin:0 auto}
.fm-quizhead{margin-bottom:20px;display:flex;flex-direction:column;gap:10px}
.fm-options{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.fm-option{text-align:left;padding:16px 18px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;transition:.15s}
.fm-option:hover:not(:disabled){border-color:var(--violet2);background:var(--surface2)}
.fm-option.is-correct{border-color:var(--green);background:rgba(52,211,153,.12)}
.fm-option.is-wrong{border-color:var(--red);background:rgba(248,113,113,.12)}
.fm-option:disabled{cursor:default}
.fm-feedback{margin-top:18px;padding:16px 18px;border-radius:14px;border:1px solid var(--border)}
.fm-feedback.is-correct{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.fm-feedback.is-wrong{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.fm-feedback .fm-btn{margin-top:10px}
.fm-wrong{color:var(--red)}
.fm-right{color:var(--green)}

.fm-chat{display:flex;flex-direction:column;height:60vh;min-height:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.fm-chat__log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.fm-chat__bubble{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5}
.fm-chat__bubble--ai{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.fm-chat__bubble--user{align-self:flex-end;background:linear-gradient(135deg,var(--violet),var(--teal));color:#fff;border-bottom-right-radius:4px}
.fm-chat__form{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border)}
.fm-chat__form input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text)}

.fm-quicklinks{display:flex;gap:10px;flex-wrap:wrap}

.fm-toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--surface2);border:1px solid var(--border);padding:12px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:100;font-size:14px}
.fm-toast.is-visible{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .fm-reveal-onscroll{opacity:1;transform:none;transition:none}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================================
   FaithMate — AI Catechism Learning Platform (Grades 1–12, Syro-Malabar Church)
   Single-bundle TypeScript app compiled to a static HTML+JS demo.

   IMPORTANT CONTENT NOTICE
   -------------------------
   All lesson text and quiz questions in DEMO_CURRICULUM below are clearly
   marked isPlaceholder = true. They are original, generic, non-denomination-
   specific illustrative content written for this demo ONLY. They are NOT
   taken from, and must not be presented as, any official Syro-Malabar
   catechism textbook. The CurriculumRepository is designed so that verified,
   licensed textbook content can be swapped in later without changing any
   page, component, or quiz-engine code — every consumer reads through the
   repository interface, never the raw array.
   ========================================================================= */
// ---------------------------------------------------------------------------
// 2. DEMO CURRICULUM DATA (placeholder — see notice above)
// ---------------------------------------------------------------------------
// Real, publicly documented fact (not fabricated): the Syro-Malabar Church's
// Synodal Commission for Catechesis publishes an official textbook series
// called "On the Path of Salvation", covering Kindergarten through Grade XII.
// FaithMate does NOT reproduce any text from that series. This app only
// references its real name/publisher, and gives teachers a place to add
// verified excerpts themselves — clearly separated from AI/demo content.
const TEXTBOOK_SERIES = {
    name: "On the Path of Salvation",
    publisher: "Syro-Malabar Synodal Commission for Catechesis",
    coverage: "Kindergarten – Grade XII",
};
const UNIT_NAMES = {
    1: "God's Wonderful World", 2: "Stories of Faith", 3: "Our Church Family",
    4: "The Life of Jesus", 5: "The Sacraments", 6: "The Ten Commandments",
    7: "The Holy Mass", 8: "Prayer & the Saints", 9: "Church History Basics",
    10: "Faith & Moral Life", 11: "The Creed in Depth", 12: "Living as a Witness",
};
function makeLesson(grade, n, title, summary, blocks) {
    return {
        id: `g${grade}-l${n}`,
        grade,
        unit: UNIT_NAMES[grade],
        title,
        summary,
        estMinutes: 8 + (n % 3) * 2,
        content: blocks.map(([heading, body]) => ({ heading, body })),
        isPlaceholder: true,
    };
}
function makeQ(grade, lessonId, n, question, options, correctIndex, explanation) {
    return { id: `${lessonId}-q${n}`, grade, lessonId, question, options, correctIndex, explanation, isPlaceholder: true };
}
const LESSONS = [];
const QUESTIONS = [];
for (let g = 1; g <= 12; g++) {
    const grade = g;
    const l1 = makeLesson(grade, 1, `Lesson 1: ${UNIT_NAMES[grade]} — Getting Started`, `A gentle introduction to this term's theme, sized for Grade ${grade} learners. [DEMO CONTENT]`, [
        ["Why this matters", `[Placeholder] At Grade ${grade} level, we begin by wondering together about ${UNIT_NAMES[grade].toLowerCase()} and why it matters in daily life.`],
        ["Key idea", `[Placeholder] This is a short, simplified explanation suitable for a Grade ${grade} student. Replace with verified textbook text before real classroom use.`],
        ["Reflect", `[Placeholder] A short reflection question a Grade ${grade} catechism teacher might ask after this lesson.`],
    ]);
    const l2 = makeLesson(grade, 2, `Lesson 2: ${UNIT_NAMES[grade]} — Going Deeper`, `Building on Lesson 1 with a slightly deeper look, still at Grade ${grade} level. [DEMO CONTENT]`, [
        ["Recap", `[Placeholder] A quick recap of Lesson 1's key idea, restated simply for Grade ${grade}.`],
        ["New idea", `[Placeholder] A second idea within ${UNIT_NAMES[grade]}, written at an appropriate reading level for Grade ${grade}.`],
        ["Try this at home", `[Placeholder] A small family activity or prayer suggestion tied to this unit.`],
    ]);
    LESSONS.push(l1, l2);
    QUESTIONS.push(makeQ(grade, l1.id, 1, `[DEMO] Which of these best matches the main idea of "${l1.title}"?`, [
        `${UNIT_NAMES[grade]} is about noticing something bigger than ourselves`,
        "It's only about memorizing dates",
        "It has nothing to do with daily life",
        "It is the same as a school science lesson",
    ], 0, `[Placeholder explanation] Lesson 1 framed ${UNIT_NAMES[grade]} as something we notice and live, not just facts to memorize.`), makeQ(grade, l1.id, 2, `[DEMO] True or False: This is Grade ${grade} content only.`, ["True", "False"], 0, `[Placeholder explanation] FaithMate always shows content matching the grade you selected — never a different grade's material.`), makeQ(grade, l2.id, 1, `[DEMO] In Lesson 2, what were you asked to try at home?`, [
        "A small family activity or prayer",
        "A written exam",
        "Nothing — Lesson 2 has no activity",
        "A trip to another country",
    ], 0, `[Placeholder explanation] Lesson 2 ended with a simple take-home activity idea.`), makeQ(grade, l2.id, 2, `[DEMO] Which grade level is this quiz written for?`.replace("Which grade level is this quiz written for?", `${UNIT_NAMES[grade]} is the unit title for which grade?`), [`Grade ${grade}`, `Grade ${grade === 12 ? 1 : grade + 1}`, `Grade ${grade === 1 ? 12 : grade - 1}`, "None of these"], 0, `[Placeholder explanation] You're currently learning Grade ${grade} content, so the unit title belongs to Grade ${grade}.`));
}
// ---------------------------------------------------------------------------
// 3. REPOSITORY LAYER (swap-ready for a real DB / verified textbook content)
// ---------------------------------------------------------------------------
const CurriculumRepository = {
    getLessonsForGrade(grade) {
        return LESSONS.filter(l => l.grade === grade);
    },
    getLesson(id) {
        return LESSONS.find(l => l.id === id);
    },
    getQuizForLesson(lessonId) {
        return QUESTIONS.filter(q => q.lessonId === lessonId);
    },
    getDailyQuiz(grade) {
        const pool = QUESTIONS.filter(q => q.grade === grade);
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 5);
    },
    getBrainModeQuestions(grade) {
        const pool = QUESTIONS.filter(q => q.grade === grade);
        return [...pool].sort(() => Math.random() - 0.5);
    },
};
function demoLeaderboard(grade) {
    const names = ["Anna Thomas", "Nevin Jose", "Diya Mathew", "Aaron Kurian", "Sara Varghese", "Liya George", "Rohan Sebastian", "Maria Joseph", "Jobin Abraham", "Angel Paul"];
    return names.map((name, i) => ({
        name,
        grade: grade ?? ((i % 12) + 1),
        xp: 1200 - i * 87 + (i % 3) * 15,
        streak: 12 - i,
    })).sort((a, b) => b.xp - a.xp);
}
const TEACHER_CLASS_SUMMARY = [
    { grade: 8, students: 24, avgProgress: 0.62, avgQuizScore: 0.78 },
    { grade: 9, students: 19, avgProgress: 0.54, avgQuizScore: 0.71 },
];
const HEADMASTER_SCHOOL_SUMMARY = Array.from({ length: 12 }, (_, i) => ({
    grade: (i + 1),
    students: 15 + ((i * 7) % 20),
    avgProgress: Math.round((0.4 + ((i * 13) % 40) / 100) * 100) / 100,
    activeTeachers: 1 + (i % 2),
}));
// ---------------------------------------------------------------------------
// 5. APP STATE (in-memory only — no browser storage APIs are used)
// ---------------------------------------------------------------------------
const state = {
    name: "",
    grade: null,
    xp: 0,
    streak: 3,
    lastActiveDay: null,
    completedLessonIds: new Set(),
    quizHistory: [],
    role: "student",
};
let lastQuizResult = null;
let activeQuiz = null;
let aiChatLog = [];
// Teacher-added chapter notes, keyed by lessonId. In-memory only for this
// session (no backend/storage) — this is where a real teacher would paste
// or upload a verified excerpt from the official textbook for their class.
const teacherChapterNotes = {};
function levelFromXp(xp) { return 1 + Math.floor(xp / 200); }
function xpIntoLevel(xp) { return xp % 200; }
function parseHash() {
    const raw = location.hash.replace(/^#\/?/, "") || "home";
    const [path, ...rest] = raw.split("/");
    const params = {};
    if (rest.length)
        params.id = rest.join("/");
    return { path, params };
}
function navigate(path) { location.hash = "#/" + path; }
function requireGrade() {
    if (state.grade === null) {
        navigate("grade-select");
        return false;
    }
    return true;
}
// ---------------------------------------------------------------------------
// 7. SMALL DOM HELPERS
// ---------------------------------------------------------------------------
function h(strings, ...vals) {
    return strings.reduce((acc, s, i) => acc + s + (vals[i] !== undefined ? String(vals[i]) : ""), "");
}
function esc(s) {
    const d = document.createElement("div");
    d.innerText = s;
    return d.innerHTML;
}
function qs(sel, root = document) {
    return root.querySelector(sel);
}
// ---------------------------------------------------------------------------
// 8. REUSABLE UI COMPONENTS (return HTML strings)
// ---------------------------------------------------------------------------
function ProgressBar(pct, label) {
    const clamped = Math.max(0, Math.min(100, Math.round(pct)));
    return h `

function localTutorReply(userText) {
    const grade = state.grade ?? 8;
    const t = userText.toLowerCase();
    if (t.includes("answer") && (t.includes("just") || t.includes("give"))) {
        return `I won't just hand you the answer — that skips the learning! Let's break it down for Grade ${grade}: what part of this feels confusing? Tell me that, and I'll give you a hint to work from.`;
    }
    if (t.length < 3) {
        return `Could you tell me a bit more about what you're studying in Grade ${grade}? For example: "Can you explain the topic of ${UNIT_NAMES[grade]}?"`;
    }
    return `Good question. Here's a Grade ${grade}-level way to think about it: start from what you already know, connect it to "${UNIT_NAMES[grade]}", and ask yourself *why* it matters, not just *what* it says. Want a hint, a fuller explanation, or a practice question on this?`;
}
async function tryRealAiTutor(userText) {
    const grade = state.grade ?? 8;
    const system = `You are FaithMate's AI catechism tutor for a Grade ${grade} Syro-Malabar Church student. ` +
        `Teach — do not just give final answers. Explain concepts simply, offer hints before answers, and adapt your ` +
        `language to a Grade ${grade} reading level. If asked to just give an answer, gently redirect to a guiding ` +
        `question or hint first. Keep replies under 120 words. This is a demo app using only clearly-labeled sample ` +
        `curriculum, not verified textbook content — you may mention that if directly relevant.`;
    try {
        const resp = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "claude-sonnet-4-6",
                max_tokens: 400,
                system,
                messages: [...aiChatLog.map(m => ({ role: m.role, content: m.text })), { role: "user", content: userText }],
            }),
        });
        if (!resp.ok)
            return null;
        const data = await resp.json();
        const block = (data.content || []).find((c) => c.type === "text");
        return block ? block.text : null;
    }
    catch {
        return null;
    }
}

// 17. QUIZ ENGINE
// ---------------------------------------------------------------------------
function startQuiz(source, lessonId) {
    const grade = state.grade;
    let questions;
    if (source === "lesson" && lessonId)
        questions = CurriculumRepository.getQuizForLesson(lessonId);
    else if (source === "daily")
        questions = CurriculumRepository.getDailyQuiz(grade);
    else
        questions = CurriculumRepository.getBrainModeQuestions(grade).slice(0, 8);
    activeQuiz = { questions, index: 0, correct: 0, wrongs: [], source };
    navigate("quiz");
}
function answerQuiz(chosenIndex) {
    if (!activeQuiz)
        return;
    const q = activeQuiz.questions[activeQuiz.index];
    const correct = chosenIndex === q.correctIndex;
    if (correct)
        activeQuiz.correct++;
    else
        activeQuiz.wrongs.push({ q, chosen: chosenIndex });
    const optionsEl = qs("#quizOptions");
    const feedbackEl = qs("#quizFeedback");
    if (optionsEl) {
        optionsEl.querySelectorAll(".fm-option").forEach((btn, i) => {
            btn.disabled = true;
            if (i === q.correctIndex)
                btn.classList.add("is-correct");
            else if (i === chosenIndex)
                btn.classList.add("is-wrong");
        });
    }
    if (feedbackEl) {
        feedbackEl.innerHTML = h `
      <div class="fm-feedback ${correct ? "is-correct" : "is-wrong"}">
        <b>${correct ? "Correct! 🎉" : "Not quite."}</b>
        <p>${esc(q.explanation)}</p>
        ${Button(activeQuiz.index + 1 < activeQuiz.questions.length ? "Next question →" : "See results →", "quiz:next")}
      </div>`;
    }
}
function finishQuiz() {
    if (!activeQuiz)
        return;
    const total = activeQuiz.questions.length;
    const correct = activeQuiz.correct;
    const xp = correct * 10 + (correct === total ? 20 : 0);
    state.xp += xp;
    const attempt = {
        lessonId: activeQuiz.source === "lesson" ? activeQuiz.questions[0]?.lessonId ?? "unknown" : activeQuiz.source,
        grade: state.grade,
        answers: activeQuiz.questions.map((q, i) => ({ questionId: q.id, chosenIndex: -1, correct: !activeQuiz.wrongs.find(w => w.q.id === q.id) })),
        xpEarned: xp,
        takenAt: Date.now(),
    };
    state.quizHistory.push(attempt);
    lastQuizResult = { lessonId: attempt.lessonId, total, correct, xp, wrongs: activeQuiz.wrongs };
    activeQuiz = null;
    navigate("quiz-results");
}

    initScrollReveal();
}
let scrollObserver = null;
function initScrollReveal() {
    if (!scrollObserver) {
        scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("is-in");
                    scrollObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
    }
    document.querySelectorAll(".fm-reveal-onscroll").forEach(el => scrollObserver.observe(el));
}
function toast(msg) {
    const el = document.createElement("div");
    el.className = "fm-toast";
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add("is-visible"));
    setTimeout(() => { el.classList.remove("is-visible"); setTimeout(() => el.remove(), 300); }, 2600);
}

// 19. GLOBAL EVENT DELEGATION
// ---------------------------------------------------------------------------
async function handleAction(action) {
    const [cmd, arg] = action.split(":");
    switch (cmd) {
        case "go":
            navigate(arg);
            break;
        case "toggle": {
            const nav = qs("#mobilenav");
            if (nav)
                nav.classList.toggle("is-open");
            break;
        }
        case "select-grade": {
            state.grade = Number(arg);
            toast(`Grade ${arg} selected`);
            navigate("dashboard");
            break;
        }
        case "open-lesson":
            if (arg)
                navigate("lesson/" + arg);
            break;
        case "finish-lesson": {
            state.completedLessonIds.add(arg);
            startQuiz("lesson", arg);
            break;
        }
        case "start-quiz":
            startQuiz(arg);
            break;
        case "answer":
            answerQuiz(Number(arg));
            break;
        case "quiz": {
            if (arg === "next") {
                if (activeQuiz) {
                    activeQuiz.index++;
                    if (activeQuiz.index >= activeQuiz.questions.length)
                        finishQuiz();
                    else
                        render();
                }
            }
            break;
        }
        case "auth": {
            if (arg === "login") {
                const val = (qs("#loginName")?.value ?? "").trim();
                state.name = val || "Guest Student";
                toast(`Welcome back, ${state.name}!`);
                navigate(state.grade ? "dashboard" : "grade-select");
            }
            else if (arg === "signup") {
                const name = (qs("#signupName")?.value ?? "").trim();
                const role = (qs("#signupRole")?.value ?? "student");
                state.name = name || "New Student";
                state.role = role;
                toast(`Account created for ${state.name}`);
                if (role === "teacher")
                    navigate("teacher-dashboard");
                else if (role === "headmaster")
                    navigate("headmaster-dashboard");
                else if (role === "graduate")
                    navigate("graduate-dashboard");
                else
                    navigate("grade-select");
            }
            break;
        }
        case "settings": {
            if (arg === "save") {
                state.name = (qs("#settingsName")?.value ?? state.name).trim();
                state.grade = Number(qs("#settingsGrade")?.value ?? state.grade);
                toast("Settings saved");
                navigate("dashboard");
            }
            break;
        }
        case "ai-about":
        case "ai-mistake": {
            const grade = state.grade ?? 8;
            const prompt = cmd === "ai-about"
                ? `Can you help me understand the lesson I just read (Grade ${grade})?`
                : `I got this question wrong: ${arg}. Can you explain it, Grade ${grade} style?`;
            navigate("ai-tutor");
            setTimeout(() => sendChat(prompt), 50);
            break;
        }
        case "chat":
            if (arg === "send")
                await sendChat((qs("#chatInput")?.value ?? "").trim());
            break;
        case "teacher": {
            if (arg === "save-notes") {
                const lessonId = qs("#tbLesson")?.value ?? "";
                const notes = (qs("#tbNotes")?.value ?? "").trim();
                if (lessonId && notes) {
                    teacherChapterNotes[lessonId] = notes;
                    toast("Chapter notes saved for this session");
                    render();
                }
                else {
                    toast("Add chapter notes before saving");
                }
            }
            break;
        }
        case "toast":
            toast(arg.replace(/-/g, " "));
            break;
    }
}
async function sendChat(text) {
    if (!text)
        return;
    aiChatLog.push({ role: "user", text });
    render();
    const input = qs("#chatInput");
    if (input)
        input.value = "";
    const thinkingId = "thinking-" + Date.now();
    const log = qs("#chatLog");
    if (log)
        log.insertAdjacentHTML("beforeend", `<div class="fm-chat__bubble fm-chat__bubble--ai" id="${thinkingId}">Thinking…</div>`);
    if (log)
        log.scrollTop = log.scrollHeight;
    const real = await tryRealAiTutor(text);
    const reply = real ?? localTutorReply(text);
    aiChatLog.push({ role: "assistant", text: reply });
    render();
}

    const target = e.target.closest("[data-action]");
    if (target) {
        e.preventDefault();
        void handleAction(target.dataset.action);

});
document.addEventListener("submit", (e) => {
    const form = e.target;
    if (form && form.id === "chatForm") {
        e.preventDefault();
        void handleAction("chat:send");
    }
});
